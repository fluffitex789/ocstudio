name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Gradle 4.10.3 installieren
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip -d "$HOME"
          echo "$HOME/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Bauen
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ocstudio-jar
          path: build/libs/*.jar
          if-no-files-found: error
